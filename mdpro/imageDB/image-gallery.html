<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>inDB 이미지 갤러리</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #080d18;
            --panel: #111827;
            --panel-2: #172033;
            --line: #334155;
            --text: #e5edf8;
            --muted: #94a3b8;
            --accent: #a855f7;
            --accent-2: #38bdf8;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .topbar {
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-bottom: 1px solid var(--line);
            background: #0f172a;
        }
        .title { min-width: 190px; }
        .title strong { display: block; font-size: 16px; }
        .title span { color: var(--muted); font-size: 11px; }
        .search {
            min-width: 160px;
            max-width: 460px;
            flex: 1;
            height: 36px;
            padding: 0 11px;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            background: #0b1220;
        }
        .search:focus { border-color: var(--accent-2); box-shadow: 0 0 0 2px rgba(56,189,248,.16); }
        select, .toolbar-btn {
            height: 36px;
            padding: 0 11px;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-2);
        }
        .toolbar-btn.primary { border-color: #7e22ce; background: #7e22ce; font-weight: 700; }
        .layout {
            min-height: 0;
            flex: 1;
            display: grid;
            grid-template-columns: minmax(300px, 34%) 1fr;
        }
        .sidebar {
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: #0d1422;
        }
        .list-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 38px;
            padding: 6px 10px;
            color: var(--muted);
            border-bottom: 1px solid #253044;
            font-size: 11px;
        }
        .image-list {
            min-height: 0;
            flex: 1;
            overflow: auto;
            padding: 8px;
        }
        .image-item {
            width: 100%;
            display: grid;
            grid-template-columns: 84px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            margin: 0 0 7px;
            padding: 7px;
            color: var(--text);
            text-align: left;
            border: 1px solid transparent;
            border-radius: 9px;
            background: #141d2d;
        }
        .image-item:hover { border-color: #475569; background: #192438; }
        .image-item.active {
            border-color: var(--accent);
            background: #28163c;
            box-shadow: 0 0 0 1px rgba(168,85,247,.24);
        }
        .thumb {
            width: 84px;
            height: 66px;
            display: block;
            object-fit: contain;
            border-radius: 6px;
            background:
                linear-gradient(45deg, #182235 25%, transparent 25%),
                linear-gradient(-45deg, #182235 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #182235 75%),
                linear-gradient(-45deg, transparent 75%, #182235 75%), #0b1220;
            background-size: 14px 14px;
            background-position: 0 0, 0 7px, 7px -7px, -7px 0;
        }
        .item-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .item-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
        .viewer {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #080d18;
        }
        .preview-stage {
            min-height: 200px;
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 18px;
            background:
                linear-gradient(45deg, #111827 25%, transparent 25%),
                linear-gradient(-45deg, #111827 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #111827 75%),
                linear-gradient(-45deg, transparent 75%, #111827 75%), #0b101b;
            background-size: 28px 28px;
            background-position: 0 0, 0 14px, 14px -14px, -14px 0;
        }
        #preview {
            display: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 16px 34px rgba(0,0,0,.45));
        }
        .empty { color: var(--muted); text-align: center; }
        .nav-btn {
            position: absolute;
            top: 50%;
            width: 42px;
            height: 58px;
            color: white;
            border: 1px solid #475569;
            border-radius: 9px;
            background: rgba(15,23,42,.76);
            transform: translateY(-50%);
        }
        .nav-btn:hover { background: rgba(126,34,206,.88); }
        #prev { left: 14px; }
        #next { right: 14px; }
        .detail {
            min-height: 112px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 16px;
            align-items: center;
            padding: 12px 14px;
            border-top: 1px solid var(--line);
            background: #0f172a;
        }
        .detail-name { overflow: hidden; font-size: 15px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
        .detail-meta { margin-top: 6px; color: var(--muted); font-size: 11px; word-break: break-all; }
        .actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
        .action {
            min-height: 36px;
            padding: 0 12px;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-2);
        }
        .action.fma { border-color: #0e7490; background: #0e7490; font-weight: 800; }
        .action.select { border-color: #7e22ce; background: #7e22ce; font-weight: 800; }
        .status {
            min-height: 26px;
            padding: 5px 12px;
            color: var(--muted);
            border-top: 1px solid #253044;
            background: #0b1220;
            font-size: 11px;
        }
        @media (max-width: 760px) {
            .topbar { flex-wrap: wrap; }
            .title { min-width: 150px; }
            .layout { grid-template-columns: 230px 1fr; }
            .image-item { grid-template-columns: 60px minmax(0, 1fr); }
            .thumb { width: 60px; height: 54px; }
            .detail { grid-template-columns: 1fr; }
            .actions { justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="title">
            <strong>inDB 이미지 갤러리</strong>
            <span>왼쪽에서 선택하면 오른쪽에 크게 표시됩니다.</span>
        </div>
        <input id="search" class="search" type="search" placeholder="파일명, 형식 검색..." autocomplete="off">
        <select id="sort" aria-label="정렬">
            <option value="newest">최근 저장순</option>
            <option value="oldest">오래된순</option>
            <option value="name">이름순</option>
            <option value="size">큰 용량순</option>
        </select>
        <button id="refresh" class="toolbar-btn" type="button">새로고침</button>
        <button id="open-fma-top" class="toolbar-btn primary" type="button">FMA Viewer</button>
    </header>

    <main class="layout">
        <aside class="sidebar">
            <div class="list-summary">
                <span id="count">0개 이미지</span>
                <span>↑ ↓ 키로 이동</span>
            </div>
            <div id="list" class="image-list"></div>
        </aside>

        <section class="viewer">
            <div class="preview-stage">
                <div id="empty" class="empty">inDB 이미지를 불러오는 중입니다...</div>
                <img id="preview" alt="선택 이미지 미리보기">
                <button id="prev" class="nav-btn" type="button" title="이전 이미지">‹</button>
                <button id="next" class="nav-btn" type="button" title="다음 이미지">›</button>
            </div>
            <div class="detail">
                <div>
                    <div id="detail-name" class="detail-name">선택된 이미지 없음</div>
                    <div id="detail-meta" class="detail-meta">왼쪽 목록에서 이미지를 선택하세요.</div>
                </div>
                <div class="actions">
                    <button id="select-image" class="action select" type="button">삽입창에서 선택</button>
                    <button id="open-fma" class="action fma" type="button">FMA Viewer로 보기</button>
                    <button id="download" class="action" type="button">다운로드</button>
                </div>
            </div>
        </section>
    </main>
    <div id="status" class="status">준비 중...</div>

    <script>
        (function () {
            'use strict';

            const DB_NAME = 'MarkdownProDB';
            const STORE_NAME = 'images';
            const state = {
                db: null,
                items: [],
                filtered: [],
                selectedId: '',
                urls: new Map()
            };

            const listEl = document.getElementById('list');
            const countEl = document.getElementById('count');
            const previewEl = document.getElementById('preview');
            const emptyEl = document.getElementById('empty');
            const nameEl = document.getElementById('detail-name');
            const metaEl = document.getElementById('detail-meta');
            const statusEl = document.getElementById('status');
            const searchEl = document.getElementById('search');
            const sortEl = document.getElementById('sort');

            function setStatus(message, error) {
                statusEl.textContent = String(message || '');
                statusEl.style.color = error ? '#fca5a5' : '';
            }

            function escapeText(value) {
                return String(value == null ? '' : value);
            }

            function formatBytes(value) {
                const bytes = Math.max(0, Number(value) || 0);
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1024 / 1024).toFixed(2) + ' MB';
            }

            function formatDate(value) {
                const date = new Date(Number(value) || 0);
                if (!Number.isFinite(date.getTime()) || !date.getTime()) return '날짜 정보 없음';
                return date.toLocaleString('ko-KR');
            }

            function getObjectUrl(item) {
                const id = String(item && item.id || '');
                if (state.urls.has(id)) return state.urls.get(id);
                const url = URL.createObjectURL(item.blob);
                state.urls.set(id, url);
                return url;
            }

            function releaseUrls() {
                state.urls.forEach(function (url) {
                    try { URL.revokeObjectURL(url); } catch (_) {}
                });
                state.urls.clear();
            }

            function openDatabase() {
                return new Promise(function (resolve, reject) {
                    const request = indexedDB.open(DB_NAME);
                    request.onsuccess = function () { resolve(request.result); };
                    request.onerror = function () { reject(request.error || new Error('DB를 열지 못했습니다.')); };
                    request.onblocked = function () { reject(new Error('다른 창에서 DB 사용이 끝나기를 기다리고 있습니다.')); };
                });
            }

            function readAllImages() {
                return new Promise(function (resolve, reject) {
                    const tx = state.db.transaction(STORE_NAME, 'readonly');
                    const request = tx.objectStore(STORE_NAME).getAll();
                    request.onsuccess = function () {
                        resolve((Array.isArray(request.result) ? request.result : []).filter(function (item) {
                            return item && item.blob && String(item.id || '').trim();
                        }));
                    };
                    request.onerror = function () { reject(request.error || new Error('이미지를 읽지 못했습니다.')); };
                });
            }

            function applyFilter() {
                const query = searchEl.value.trim().toLowerCase();
                const sort = sortEl.value;
                state.filtered = state.items.filter(function (item) {
                    if (!query) return true;
                    return [item.name, item.id, item.mime, item.blob && item.blob.type]
                        .some(function (value) { return String(value || '').toLowerCase().includes(query); });
                });
                state.filtered.sort(function (a, b) {
                    if (sort === 'oldest') return Number(a.createdAt || 0) - Number(b.createdAt || 0);
                    if (sort === 'name') return String(a.name || a.id).localeCompare(String(b.name || b.id), 'ko');
                    if (sort === 'size') return Number(b.blob.size || 0) - Number(a.blob.size || 0);
                    return Number(b.createdAt || 0) - Number(a.createdAt || 0);
                });
                renderList();
                if (!state.filtered.some(function (item) { return String(item.id) === state.selectedId; })) {
                    selectItem(state.filtered[0] || null);
                } else {
                    updateActiveItem();
                }
            }

            function renderList() {
                listEl.replaceChildren();
                countEl.textContent = state.filtered.length + '개 / 전체 ' + state.items.length + '개';
                if (!state.filtered.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.style.padding = '24px 8px';
                    empty.textContent = state.items.length ? '검색 결과가 없습니다.' : 'inDB에 저장된 이미지가 없습니다.';
                    listEl.appendChild(empty);
                    return;
                }
                const fragment = document.createDocumentFragment();
                state.filtered.forEach(function (item) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'image-item';
                    button.dataset.id = String(item.id);
                    button.title = escapeText(item.name || item.id);

                    const image = document.createElement('img');
                    image.className = 'thumb';
                    image.src = getObjectUrl(item);
                    image.alt = '';
                    image.loading = 'lazy';

                    const info = document.createElement('div');
                    const title = document.createElement('div');
                    title.className = 'item-name';
                    title.textContent = escapeText(item.name || item.id);
                    const meta = document.createElement('div');
                    meta.className = 'item-meta';
                    meta.textContent = formatBytes(item.blob.size) + ' · ' + escapeText(item.mime || item.blob.type || 'image');
                    info.append(title, meta);
                    button.append(image, info);
                    button.addEventListener('click', function () { selectItem(item); });
                    button.addEventListener('dblclick', function () {
                        selectItem(item);
                        openInFmaViewer();
                    });
                    fragment.appendChild(button);
                });
                listEl.appendChild(fragment);
                updateActiveItem();
            }

            function updateActiveItem() {
                Array.from(listEl.querySelectorAll('.image-item')).forEach(function (button) {
                    const active = button.dataset.id === state.selectedId;
                    button.classList.toggle('active', active);
                    if (active) button.scrollIntoView({ block: 'nearest' });
                });
            }

            function selectItem(item) {
                if (!item) {
                    state.selectedId = '';
                    previewEl.style.display = 'none';
                    previewEl.removeAttribute('src');
                    emptyEl.style.display = 'block';
                    emptyEl.textContent = state.items.length ? '검색 결과가 없습니다.' : 'inDB에 저장된 이미지가 없습니다.';
                    nameEl.textContent = '선택된 이미지 없음';
                    metaEl.textContent = '왼쪽 목록에서 이미지를 선택하세요.';
                    updateActiveItem();
                    return;
                }
                state.selectedId = String(item.id);
                const url = getObjectUrl(item);
                emptyEl.style.display = 'none';
                previewEl.style.display = 'block';
                previewEl.onload = function () {
                    metaEl.textContent =
                        previewEl.naturalWidth + ' × ' + previewEl.naturalHeight + ' px · ' +
                        formatBytes(item.blob.size) + ' · ' +
                        escapeText(item.mime || item.blob.type || 'image') + ' · ' +
                        formatDate(item.createdAt) + ' · ID: ' + escapeText(item.id);
                };
                previewEl.src = url;
                nameEl.textContent = escapeText(item.name || item.id);
                metaEl.textContent =
                    formatBytes(item.blob.size) + ' · ' +
                    escapeText(item.mime || item.blob.type || 'image') + ' · ' +
                    formatDate(item.createdAt);
                updateActiveItem();
                setStatus('선택됨: ' + escapeText(item.name || item.id), false);
            }

            function getSelectedItem() {
                return state.items.find(function (item) { return String(item.id) === state.selectedId; }) || null;
            }

            function moveSelection(step) {
                if (!state.filtered.length) return;
                let index = state.filtered.findIndex(function (item) { return String(item.id) === state.selectedId; });
                if (index < 0) index = 0;
                else index = (index + step + state.filtered.length) % state.filtered.length;
                selectItem(state.filtered[index]);
            }

            function openInFmaViewer() {
                const selected = getSelectedItem();
                if (!selected) {
                    setStatus('먼저 이미지를 선택하세요.', true);
                    return;
                }
                try {
                    if (!window.opener || window.opener.closed) {
                        throw new Error('원본 md-viewer 창에서 갤러리를 다시 열어 주세요.');
                    }
                    window.opener.postMessage({
                        type: 'image-gallery-request-fma-open',
                        id: String(selected.id)
                    }, '*');
                    setStatus('FMA Viewer의 기존 이미지 상태를 확인하는 중...', false);
                } catch (error) {
                    setStatus('FMA Viewer 열기 실패: ' + (error.message || error), true);
                }
            }

            function continueOpenInFmaViewer(data) {
                const selectedId = String(data && data.id || state.selectedId || '');
                const existingCount = Math.max(0, Number(data && data.existingCount) || 0);
                let importMode = 'replace';
                if (existingCount > 0) {
                    const append = window.confirm(
                        'FMA Viewer에 기존 이미지 ' + existingCount + '개가 있습니다.\n\n' +
                        'inDB 이미지를 기존 갤러리에 추가할까요?\n\n' +
                        '[확인] 이미지 추가  ·  [취소] 초기화 선택으로 이동'
                    );
                    if (append) importMode = 'append';
                    else {
                        const replace = window.confirm(
                            '기존 이미지를 초기화하고 inDB 이미지를 새로 넣을까요?\n\n' +
                            '[확인] 초기화하고 새로 넣기  ·  [취소] 작업 취소'
                        );
                        if (!replace) {
                            setStatus('FMA Viewer로 이미지 보내기를 취소했습니다.', false);
                            return;
                        }
                    }
                }
                if (!window.opener || window.opener.closed) {
                    setStatus('원본 md-viewer 창이 닫혀 있습니다.', true);
                    return;
                }
                window.opener.postMessage({
                    type: 'image-gallery-open-fma',
                    id: selectedId,
                    importMode: importMode
                }, '*');
                window.opener.focus();
                setStatus(importMode === 'append'
                    ? '기존 FMA Viewer 갤러리에 이미지 추가를 요청했습니다.'
                    : 'FMA Viewer 초기화 후 이미지 열기를 요청했습니다.', false);
            }

            function selectInInsertWindow() {
                const selected = getSelectedItem();
                if (!selected) {
                    setStatus('먼저 이미지를 선택하세요.', true);
                    return;
                }
                if (!window.opener || window.opener.closed) {
                    setStatus('원본 md-viewer 창이 닫혀 있습니다.', true);
                    return;
                }
                window.opener.postMessage({
                    type: 'image-gallery-select',
                    id: String(selected.id)
                }, '*');
                window.opener.focus();
                setStatus('이미지 삽입창에 선택 내용을 전달했습니다.', false);
            }

            function downloadSelected() {
                const selected = getSelectedItem();
                if (!selected) return;
                const anchor = document.createElement('a');
                anchor.href = getObjectUrl(selected);
                anchor.download = String(selected.name || ('image_' + selected.id));
                anchor.click();
            }

            async function loadImages() {
                setStatus('inDB 이미지를 불러오는 중...', false);
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'image-gallery-request-records' }, '*');
                }
                try {
                    if (!state.db) state.db = await openDatabase();
                    const previousId = state.selectedId;
                    releaseUrls();
                    state.items = await readAllImages();
                    state.selectedId = previousId;
                    applyFilter();
                    setStatus('inDB 이미지 ' + state.items.length + '개를 불러왔습니다.', false);
                } catch (error) {
                    state.items = [];
                    state.filtered = [];
                    renderList();
                    selectItem(null);
                    setStatus('갤러리 로드 실패: ' + (error.message || error), true);
                }
            }

            searchEl.addEventListener('input', applyFilter);
            sortEl.addEventListener('change', applyFilter);
            document.getElementById('refresh').addEventListener('click', loadImages);
            document.getElementById('open-fma-top').addEventListener('click', openInFmaViewer);
            document.getElementById('open-fma').addEventListener('click', openInFmaViewer);
            document.getElementById('select-image').addEventListener('click', selectInInsertWindow);
            document.getElementById('download').addEventListener('click', downloadSelected);
            document.getElementById('prev').addEventListener('click', function () { moveSelection(-1); });
            document.getElementById('next').addEventListener('click', function () { moveSelection(1); });
            document.addEventListener('keydown', function (event) {
                if (event.target === searchEl) return;
                if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                    moveSelection(-1);
                    event.preventDefault();
                } else if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
                    moveSelection(1);
                    event.preventDefault();
                } else if (event.key === 'Enter') {
                    openInFmaViewer();
                    event.preventDefault();
                }
            });
            window.addEventListener('message', function (event) {
                if (window.opener && event.source !== window.opener) return;
                if (event.data && event.data.type === 'image-gallery-refresh') loadImages();
                if (event.data && event.data.type === 'image-gallery-records') {
                    releaseUrls();
                    state.items = (Array.isArray(event.data.records) ? event.data.records : []).filter(function (item) {
                        return item && item.blob && String(item.id || '').trim();
                    });
                    applyFilter();
                    setStatus('원본 창에서 inDB 이미지 ' + state.items.length + '개를 불러왔습니다.', false);
                }
                if (event.data && event.data.type === 'image-gallery-error') {
                    setStatus('갤러리 로드 실패: ' + String(event.data.message || '알 수 없는 오류'), true);
                }
                if (event.data && event.data.type === 'image-gallery-fma-open-choice') {
                    continueOpenInFmaViewer(event.data);
                }
            });
            window.addEventListener('beforeunload', function () {
                releaseUrls();
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'image-gallery-closed' }, '*');
                }
                try { if (state.db) state.db.close(); } catch (_) {}
            });

            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'image-gallery-ready' }, '*');
            }
            loadImages();
        })();
    </script>
</body>
</html>
