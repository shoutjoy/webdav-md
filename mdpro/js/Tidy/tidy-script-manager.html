<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TIDY 사용자 JS 관리</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #020617; color: #e2e8f0; }
        button, input, textarea { font: inherit; }
        button { cursor: pointer; }
        .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
        header { padding: 18px 22px; border-bottom: 1px solid #1e293b; background: #0f172a; }
        h1 { margin: 0 0 5px; font-size: 19px; }
        header p, .help { margin: 0; color: #94a3b8; font-size: 12px; line-height: 1.55; }
        main { display: grid; grid-template-columns: minmax(230px, 0.32fr) minmax(460px, 1fr); min-height: 0; }
        aside { border-right: 1px solid #1e293b; padding: 16px; overflow: auto; }
        .editor { padding: 18px; overflow: auto; }
        .toolbar, .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .toolbar { margin-bottom: 12px; }
        .btn { border: 1px solid #475569; border-radius: 7px; background: #172033; color: #e2e8f0; padding: 7px 11px; font-size: 12px; font-weight: 700; }
        .btn:hover { background: #243147; }
        .btn.primary { background: #0891b2; border-color: #22d3ee; color: white; }
        .btn.danger { color: #fecaca; border-color: #7f1d1d; background: #32151b; }
        .script-list { display: grid; gap: 7px; }
        .script-item { width: 100%; text-align: left; border: 1px solid #334155; border-radius: 8px; padding: 10px; background: #0f172a; color: #cbd5e1; }
        .script-item.active { border-color: #22d3ee; box-shadow: 0 0 0 1px #22d3ee inset; }
        .script-item small { display: block; margin-top: 4px; color: #64748b; }
        label.field { display: block; margin-bottom: 13px; }
        label.field > span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 800; color: #cbd5e1; }
        input[type="text"], textarea { width: 100%; border: 1px solid #334155; border-radius: 8px; background: #07101f; color: #f8fafc; padding: 10px 11px; outline: none; }
        input[type="text"]:focus, textarea:focus { border-color: #22d3ee; box-shadow: 0 0 0 2px rgba(34,211,238,.16); }
        textarea { min-height: 390px; resize: vertical; font-family: Consolas, "Cascadia Code", monospace; line-height: 1.55; tab-size: 2; }
        .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .tab.active { border-color: #22d3ee; color: #67e8f9; }
        .upload { display: none; border: 1px dashed #475569; border-radius: 9px; padding: 14px; margin-bottom: 10px; background: rgba(15,23,42,.6); }
        .upload.visible { display: block; }
        .storage { margin-top: 14px; padding: 12px; border: 1px solid #334155; border-radius: 9px; background: #0f172a; }
        .storage label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-right: 14px; }
        .status { min-height: 38px; padding: 10px 18px; border-top: 1px solid #1e293b; color: #94a3b8; background: #0f172a; font-size: 12px; }
        .status.ok { color: #86efac; } .status.error { color: #fca5a5; }
        .warning { margin: 10px 0 14px; padding: 10px 12px; border: 1px solid #713f12; border-radius: 8px; color: #fde68a; background: #241704; font-size: 12px; line-height: 1.5; }
        @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #1e293b; max-height: 240px; } textarea { min-height: 300px; } }
    </style>
</head>
<body>
<div class="shell">
    <header>
        <h1>TIDY 사용자 JS 추가·관리</h1>
        <p>직접 입력하거나 .js 파일을 업로드하세요. 저장한 기능은 메인 창의 TIDY 메뉴에 버튼으로 추가됩니다.</p>
    </header>
    <main>
        <aside>
            <div class="toolbar">
                <button class="btn primary" id="new-btn" type="button">+ 새 기능</button>
                <button class="btn" id="sqlite-import-btn" type="button">SQLite 가져오기</button>
                <button class="btn" id="github-import-btn" type="button">GitHub 가져오기</button>
            </div>
            <div id="script-list" class="script-list"></div>
        </aside>
        <section class="editor">
            <label class="field"><span>기능 이름</span><input id="name" type="text" maxlength="60" placeholder="예: 인용문 정리"></label>
            <div class="tabs">
                <button class="btn tab active" data-mode="direct" type="button">직접 입력</button>
                <button class="btn tab" data-mode="upload" type="button">JS 업로드</button>
            </div>
            <div id="upload-panel" class="upload">
                <input id="file" type="file" accept=".js,text/javascript,application/javascript">
                <p class="help">업로드한 코드를 아래 편집기에 불러온 뒤 확인하고 저장합니다.</p>
            </div>
            <label class="field"><span>변환 함수</span><textarea id="code" spellcheck="false"></textarea></label>
            <div class="warning">신뢰하는 코드만 추가하세요. 코드는 자동 실행되지 않으며, TIDY에서 해당 기능 버튼을 눌렀을 때 선택 영역 또는 문서 전체를 변환합니다. 실행은 10초 후 자동 중단됩니다.</div>
            <label class="row"><input id="enabled" type="checkbox" checked> TIDY 메뉴에 표시</label>
            <div class="storage">
                <div class="help" style="margin-bottom:8px">저장 위치: inDB에는 항상 복구본을 저장합니다. 필요하면 SQLite와 GitHub에도 동기화합니다.</div>
                <label><input type="checkbox" checked disabled> inDB</label>
                <label><input id="save-sqlite" type="checkbox"> SQLite</label>
                <label><input id="save-github" type="checkbox"> GitHub (.js)</label>
                <div id="storage-detail" class="help" style="margin-top:8px"></div>
            </div>
            <div class="toolbar" style="margin-top:16px">
                <button class="btn primary" id="save-btn" type="button">저장</button>
                <button class="btn danger" id="delete-btn" type="button">삭제</button>
                <button class="btn" id="close-btn" type="button">창 닫기</button>
            </div>
        </section>
    </main>
    <div id="status" class="status">준비 중...</div>
</div>
<script>
(function () {
    'use strict';
    var bridge = window.opener && window.opener.TidyScriptManagerBridge;
    var records = [];
    var selectedId = '';
    var template = 'function transform(source, context) {\n  // source: 선택 영역 또는 문서 전체 Markdown\n  // context.scope: "selection" 또는 "document"\n  return source;\n}';
    var $ = function (id) { return document.getElementById(id); };

    function status(message, kind) {
        $('status').textContent = message;
        $('status').className = 'status' + (kind ? ' ' + kind : '');
    }
    function current() { return records.find(function (item) { return item.id === selectedId; }); }
    function setForm(record) {
        var item = record || {};
        selectedId = item.id || '';
        $('name').value = item.name || '';
        $('code').value = item.code || template;
        $('enabled').checked = item.enabled !== false;
        $('save-sqlite').checked = !!(item.mirrors && item.mirrors.sqlite);
        $('save-github').checked = !!(item.mirrors && item.mirrors.github);
        $('delete-btn').disabled = !selectedId;
        renderList();
    }
    function renderList() {
        var list = $('script-list');
        list.replaceChildren();
        if (!records.length) {
            var empty = document.createElement('p');
            empty.className = 'help';
            empty.textContent = '추가한 사용자 JS 기능이 없습니다.';
            list.appendChild(empty);
            return;
        }
        records.forEach(function (item) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'script-item' + (item.id === selectedId ? ' active' : '');
            button.textContent = item.name;
            var small = document.createElement('small');
            small.textContent = item.enabled === false ? '숨김' : 'TIDY 표시';
            button.appendChild(small);
            button.onclick = function () { setForm(item); };
            list.appendChild(button);
        });
    }
    async function reload(selectId) {
        records = await bridge.list();
        var next = records.find(function (item) { return item.id === selectId; }) || records[0];
        setForm(next || null);
    }
    async function save() {
        status('저장 중...');
        try {
            var result = await bridge.save({
                id: selectedId,
                name: $('name').value,
                code: $('code').value,
                enabled: $('enabled').checked,
                sourceName: $('file').files[0] ? $('file').files[0].name : (current() && current().sourceName || ''),
                storage: { sqlite: $('save-sqlite').checked, github: $('save-github').checked }
            });
            await reload(result.record.id);
            var message = '저장 완료: ' + result.savedTo.join(', ');
            if (result.warnings.length) message += ' / 일부 동기화 실패: ' + result.warnings.join(' | ');
            status(message, result.warnings.length ? 'error' : 'ok');
        } catch (error) { status(error && error.message ? error.message : String(error), 'error'); }
    }
    async function remove() {
        var item = current();
        if (!item || !confirm('"' + item.name + '" 기능을 삭제할까요?')) return;
        status('삭제 중...');
        try {
            var result = await bridge.remove(item.id, { sqlite: $('save-sqlite').checked, github: $('save-github').checked });
            await reload('');
            status(result.warnings.length ? ('로컬 삭제 완료 / ' + result.warnings.join(' | ')) : '삭제 완료', result.warnings.length ? 'error' : 'ok');
        } catch (error) { status(error && error.message ? error.message : String(error), 'error'); }
    }
    async function importFrom(kind) {
        status(kind + '에서 가져오는 중...');
        try {
            var result = kind === 'SQLite' ? await bridge.importSqlite() : await bridge.importGithub();
            await reload('');
            status(kind + '에서 ' + result.imported + '개를 가져왔습니다. 전체 ' + result.total + '개', 'ok');
        } catch (error) { status(error && error.message ? error.message : String(error), 'error'); }
    }
    document.querySelectorAll('.tab').forEach(function (button) {
        button.onclick = function () {
            document.querySelectorAll('.tab').forEach(function (item) { item.classList.toggle('active', item === button); });
            $('upload-panel').classList.toggle('visible', button.dataset.mode === 'upload');
        };
    });
    $('file').onchange = async function () {
        var file = $('file').files[0];
        if (!file) return;
        if (!/\.js$/i.test(file.name)) { status('.js 파일만 업로드할 수 있습니다.', 'error'); return; }
        try {
            var parsed = bridge.parseUpload(await file.text(), file.name);
            $('name').value = parsed.name || file.name.replace(/\.js$/i, '');
            $('code').value = parsed.code || '';
            $('enabled').checked = parsed.enabled !== false;
            status(file.name + '을 불러왔습니다. 코드를 확인한 뒤 저장하세요.', 'ok');
        } catch (error) { status('파일 읽기 실패: ' + (error.message || error), 'error'); }
    };
    $('new-btn').onclick = function () { setForm(null); $('name').focus(); };
    $('save-btn').onclick = save;
    $('delete-btn').onclick = remove;
    $('close-btn').onclick = function () { window.close(); };
    $('sqlite-import-btn').onclick = function () { importFrom('SQLite'); };
    $('github-import-btn').onclick = function () { importFrom('GitHub'); };

    if (!bridge) { status('메인 MD Viewer 창과 연결할 수 없습니다. TIDY 메뉴에서 다시 여세요.', 'error'); return; }
    Promise.all([reload(''), bridge.getStorageStatus()]).then(function (values) {
        var storage = values[1] || {};
        $('save-sqlite').disabled = !storage.sqliteAvailable;
        $('sqlite-import-btn').disabled = !storage.sqliteAvailable;
        $('save-github').disabled = !storage.githubAvailable;
        $('github-import-btn').disabled = !storage.githubAvailable;
        $('storage-detail').textContent = 'SQLite: ' + (storage.sqliteAvailable ? (storage.sqliteBackend || '연결됨') : '사용 불가')
            + ' / GitHub: ' + (storage.githubAvailable ? (storage.githubRepo + ' · ' + storage.githubBranch) : '설정 필요');
        status('준비되었습니다.', 'ok');
    }).catch(function (error) { status(error && error.message ? error.message : String(error), 'error'); });
})();
</script>
</body>
</html>
