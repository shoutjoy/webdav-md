<!-- Merge Modal (document merge) -->
<div id="merge-modal" data-source="merge-doc" class="fixed inset-0 hidden z-[55] no-print pointer-events-none bg-transparent">
  <div id="merge-panel" class="pointer-events-auto fixed bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-4 w-[min(900px,92vw)] h-[min(640px,88vh)] min-w-[300px] min-h-[320px] flex flex-col overflow-hidden">
    <div id="merge-panel-header" class="flex items-center justify-between mb-3 gap-2 cursor-move touch-none select-none shrink-0">
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
        <i data-lucide="layers" class="w-5 h-5"></i> 문서 묶기
      </h3>
      <div class="flex items-center gap-1">
        <button type="button" id="merge-fullscreen-button" title="전체화면"
          class="p-1.5 rounded border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
          <i data-lucide="maximize-2" class="w-4 h-4"></i>
          <span class="sr-only">전체화면</span>
        </button>
        <button type="button" onclick="closeMergeModal()"
          class="px-2 py-1 rounded border border-slate-300 dark:border-slate-600 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">Close</button>
      </div>
    </div>
    <div id="merge-layout" class="flex-1 min-h-0">
      <div id="merge-menu-pane">
        <div class="grid grid-cols-2 gap-2 mb-3 shrink-0" role="tablist" aria-label="문서 출처">
          <button type="button" id="merge-source-local" onclick="switchMergeSource('local')"
            class="px-3 py-2 rounded-md border text-sm font-bold">Local</button>
          <button type="button" id="merge-source-indb" onclick="switchMergeSource('indb')"
            class="px-3 py-2 rounded-md border text-sm font-bold">inDB</button>
        </div>
        <div id="merge-local-import-tools"
          class="hidden mb-3 shrink-0 rounded-lg border border-dashed border-slate-300 dark:border-slate-600 p-2">
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="openMergeLocalFiles()"
              class="px-3 py-2 rounded-md bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center justify-center gap-1">
              <i data-lucide="files" class="w-4 h-4"></i>파일 불러오기
            </button>
            <button type="button" onclick="openMergeLocalFolder()"
              class="px-3 py-2 rounded-md border border-indigo-300 dark:border-indigo-600 text-indigo-700 dark:text-indigo-300 text-xs font-bold hover:bg-indigo-50 dark:hover:bg-indigo-950 flex items-center justify-center gap-1">
              <i data-lucide="folder-open" class="w-4 h-4"></i>폴더 불러오기
            </button>
          </div>
          <p id="merge-local-import-status" class="mt-2 text-[11px] leading-4 text-slate-500 dark:text-slate-400">md, txt, html, docx, pdf, csv, json 파일을 여러 개 또는 폴더째 불러올 수 있습니다.</p>
          <input id="merge-local-file-input" type="file" multiple
            accept=".md,.markdown,.mdown,.txt,.html,.htm,.docx,.pdf,.csv,.json" class="hidden"
            onchange="importMergeLocalFiles(this.files, false); this.value=''">
          <input id="merge-local-folder-input" type="file" multiple webkitdirectory directory
            accept=".md,.markdown,.mdown,.txt,.html,.htm,.docx,.pdf,.csv,.json" class="hidden"
            onchange="importMergeLocalFiles(this.files, true); this.value=''">
        </div>
        <div class="flex items-center gap-2 mb-2 shrink-0">
          <span class="text-xs font-bold text-slate-500 dark:text-slate-300 shrink-0">결과 저장</span>
          <div class="grid grid-cols-2 gap-1 flex-1">
            <button type="button" id="merge-target-local" onclick="switchMergeTarget('local')"
              class="px-2 py-1 rounded border text-xs font-bold">가져온 폴더</button>
            <button type="button" id="merge-target-indb" onclick="switchMergeTarget('indb')"
              class="px-2 py-1 rounded border text-xs font-bold">inDB Bind</button>
          </div>
        </div>
        <div class="mb-3 shrink-0 rounded-lg border border-slate-200 dark:border-slate-600 p-2">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="text-xs font-bold text-slate-600 dark:text-slate-300">문서 순서</span>
            <span id="merge-focused-label" class="text-[10px] text-slate-500 dark:text-slate-400 truncate">목록에서 문서를 선택하세요</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="merge-move-up-button" onclick="moveFocusedMergeItem(-1)"
              class="px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40" disabled>
              <i data-lucide="arrow-up" class="inline w-4 h-4 mr-1"></i>위로
            </button>
            <button type="button" id="merge-move-down-button" onclick="moveFocusedMergeItem(1)"
              class="px-3 py-2 rounded-md border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40" disabled>
              <i data-lucide="arrow-down" class="inline w-4 h-4 mr-1"></i>아래로
            </button>
          </div>
        </div>
        <div class="flex gap-2 mb-3 shrink-0">
          <input type="text" id="merge-bundle-name" placeholder="새로운 묶음 파일"
            class="flex-1 min-w-0 px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">
          <button type="button" id="merge-bind-button"
            class="px-4 py-2 bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-800 rounded-md text-sm font-bold border border-slate-700 dark:border-slate-300 hover:bg-slate-700 dark:hover:bg-slate-300">Bind</button>
        </div>
        <div class="mb-3 shrink-0 rounded-lg border border-slate-200 dark:border-slate-600 p-2 space-y-2">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
            <label class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer">
              <input id="merge-cover-enabled" type="checkbox" onchange="toggleMergeCoverOptions(this.checked)" class="rounded border-slate-300 text-indigo-600">표지 넣기
            </label>
            <label class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-200 cursor-pointer">
              <input id="merge-toc-enabled" type="checkbox" class="rounded border-slate-300 text-indigo-600">자동 목차 넣기
            </label>
          </div>
          <div id="merge-cover-fields" class="hidden grid grid-cols-1 gap-2 pt-2 border-t border-slate-200 dark:border-slate-600">
            <input id="merge-cover-title" type="text" placeholder="표지 제목" class="w-full min-w-0 px-3 py-2 rounded-md border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm">
            <input id="merge-cover-subtitle" type="text" placeholder="부제목" class="w-full min-w-0 px-3 py-2 rounded-md border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm">
            <input id="merge-cover-author" type="text" placeholder="작성자" class="w-full min-w-0 px-3 py-2 rounded-md border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm">
            <input id="merge-cover-institution" type="text" placeholder="기관" class="w-full min-w-0 px-3 py-2 rounded-md border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm">
            <input id="merge-cover-date" type="text" placeholder="작성일" class="w-full min-w-0 px-3 py-2 rounded-md border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm">
          </div>
          <p class="text-[10px] leading-4 text-slate-500 dark:text-slate-400">표지 또는 자동 목차를 사용하면 결과는 DOCX로 생성됩니다.</p>
        </div>
      </div>
      <div id="merge-list-pane">
        <div class="mb-3 shrink-0 space-y-2">
          <input type="text" id="merge-search-input" placeholder="문서 검색..." oninput="filterMergeList(this.value)"
            class="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectAllMergeItems()"
              class="px-3 py-1.5 text-xs font-medium border border-slate-200 dark:border-slate-600 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">전체선택</button>
            <button type="button" onclick="deselectAllMergeItems()"
              class="px-3 py-1.5 text-xs font-medium border border-slate-200 dark:border-slate-600 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">전체 해제</button>
            <button type="button" id="merge-selected-only-btn" onclick="toggleSelectedOnlyMergeView()"
              class="px-3 py-1.5 text-xs font-medium border border-slate-900 dark:border-slate-100 rounded-md text-slate-900 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-700">선택 보기</button>
          </div>
        </div>
        <div id="merge-list" class="flex-1 overflow-y-auto space-y-2 min-h-0 custom-scrollbar" aria-live="polite"></div>
        <div id="merge-list-density-controls" class="mt-2 pt-2 border-t border-slate-200 dark:border-slate-600 flex items-center justify-between gap-2 shrink-0">
          <span id="merge-list-count" class="text-[10px] text-slate-500 dark:text-slate-400">0개 문서</span>
          <div class="flex items-center gap-1" aria-label="목록 표시 크기">
            <span class="text-[10px] text-slate-500 dark:text-slate-400 mr-1">목록 크기</span>
            <button type="button" id="merge-density-smaller" onclick="adjustMergeListDensity(-1)" title="목록을 더 작게"
              class="w-7 h-7 rounded border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">−</button>
            <button type="button" id="merge-density-label" onclick="setMergeListDensity(100)" title="기본 크기로 복원"
              class="min-w-[46px] h-7 px-2 rounded border border-slate-300 dark:border-slate-600 text-[10px] font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">100%</button>
            <button type="button" id="merge-density-larger" onclick="adjustMergeListDensity(1)" title="목록을 더 크게"
              class="w-7 h-7 rounded border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">+</button>
          </div>
        </div>
      </div>
    </div>
    <div id="merge-panel-resizer" title="Resize"
      class="absolute right-0 bottom-0 w-5 h-5 cursor-nwse-resize touch-none opacity-70 hover:opacity-100 select-none"
      style="background:linear-gradient(135deg,transparent 45%,#94a3b8 46%,#94a3b8 54%,transparent 55%);"></div>
  </div>
</div>
