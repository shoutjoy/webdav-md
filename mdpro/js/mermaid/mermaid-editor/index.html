<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Ref</title>
  <link rel="stylesheet" href="style.css?v=20261112-webdav-jena-1&amp;mobileCompact=20261113-2&amp;revisionChat=20261113-13&amp;codeRevision=20261111-1&amp;envJena=20261111-1&amp;v=20261111-me-insert-toolbar-1" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.min.js"></script>
</head>


<body>
  <header id="top-bar">
    <div id="toolbar-layout-controls" aria-label="메뉴 배치">
      <span id="toolbar-drag-handle" title="드래그하여 메뉴 이동">도구 메뉴</span>
      <select id="collapsed-example-select" aria-label="Mermaid 샘플 선택" onchange="loadTemplateFromCollapsedMenu(this.value)"></select>
      <button id="toolbar-collapse-btn" type="button" class="btn toolbar-layout-btn" onclick="toggleToolbarCollapsed()" title="상단 메뉴 접기">메뉴 접기</button>
      <button onclick="insertIntoDocument()" class="btn">코드로 문서삽입</button>
      <button onclick="sendRenderedSvgToImageInsert()" class="btn" title="SVG로 이미지 넣기" aria-label="SVG로 이미지 넣기">SVG &lt;-</button>
      <button onclick="sendRenderedPngToImageInsert()" class="btn" title="PNG로 이미지 넣기" aria-label="PNG로 이미지 넣기">PNG &lt;-</button>
      <button id="toolbar-float-btn" type="button" class="btn toolbar-layout-btn" onclick="toggleToolbarFloating()" title="세로형 플로팅 메뉴">세로 플로팅</button>
      <button id="ui-theme-toggle-btn" type="button" class="btn toolbar-layout-btn" onclick="toggleUiTheme()" title="ME 전체 UI를 다크 또는 라이트로 전환" aria-pressed="false">UI Dark</button>
    </div>
    <div class="toolbar-left">
      <strong>Mermaid Ref</strong>
      <button onclick="setDirection('TD')" id="dir-TD" class="btn active">TD</button>
      <button onclick="setDirection('LR')" id="dir-LR" class="btn">LR</button>
    </div>



    <div class="toolbar-right">
      <div class="toolbar-row">

        <!--  config insert -->
        <select id="config-template-select" class="select-like-btn">
          <option value="">Config insert</option>
          <option value="theme-default">Theme: default</option>
          <option value="theme-dark">Theme: dark</option>
          <option value="theme-neutral">Theme: neutral</option>
          <option value="theme-forest">Theme: forest</option>
          <option value="theme-base">Theme: base</option>
          <option value="curve-linear">Flowchart curve: linear</option>
          <option value="curve-basis">Flowchart curve: basis</option>
          <option value="curve-step">Flowchart curve: stepAfter</option>
          <option value="spacing-wide">Flowchart spacing: wide</option>
          <option value="html-labels">Flowchart htmlLabels: true</option>
          <option value="brand-primary">Brand: primaryColor</option>
          <option value="brand-line">Brand: lineColor</option>
          <option value="brand-font-family">Brand: fontFamily</option>
          <option value="brand-font-size">Brand: fontSize</option>
          <option value="brand-cluster">Brand: clusterBkg</option>
          <option value="kanban-ticket">Kanban: ticketBaseUrl</option>
          <option value="sequence-align">Sequence: align + mirrorActors</option>
          <option value="gantt-compact">Gantt: compact</option>
          <option value="mindmap-width">Mindmap: maxNodeWidth</option>
        </select>
        <button onclick="insertConfigTemplateFromSelect()" class="btn">Config &#xC0BD;&#xC785;</button>


        <!-- Unicode entity labels to avoid encoding issues -->
        <input id="node-label" class="input-like" type="text" placeholder="&#xB178;&#xB4DC; &#xD14D;&#xC2A4;&#xD2B8;" />
        <select id="node-shape" class="select-like-btn">
          <option value="rect">&#xC0AC;&#xAC01;&#xD615; [ ]</option> <!-- Rectangle -->
          <option value="round">&#xB77C;&#xC6B4;&#xB4DC; &#xC0AC;&#xAC01;&#xD615; ( )</option> <!-- Rounded rectangle -->
          <option value="stadium">&#xC2A4;&#xD0C0;&#xB514;&#xC6C0; ([ ])</option> <!-- Stadium -->
          <option value="subroutine">&#xC11C;&#xBE0C;&#xB8E8;&#xD2F4; [[ ]]</option> <!-- Subroutine -->
          <option value="diamond">&#xC870;&#xAC74; (&#xB9C8;&#xB984;&#xBAA8;) { }</option> <!-- Condition (diamond) -->
          <option value="hexagon">&#xC721;&#xAC01;&#xD615; {{ }}</option> <!-- Hexagon -->
          <option value="asymmetric">&#xBE44;&#xB300;&#xCE6D; &gt; ]</option> <!-- Asymmetric -->
          <option value="cylinder">&#xC6D0;&#xAE30;&#xB465; [( )]</option> <!-- Cylinder (database) -->
          <option value="parallelogram">&#xD3C9;&#xD589;&#xC0AC;&#xBCC0;&#xD615; [/ /]</option> <!-- Parallelogram -->
          <option value="trapezoid">&#xC0AC;&#xB2E4;&#xB9AC;&#xAF34; [/ \]</option> <!-- Trapezoid -->
          <option value="circle">&#xC6D0; (( ))</option> <!-- Circle -->
          <option value="double-circle">&#xC774;&#xC911; &#xC6D0; ((( )))</option> <!-- Double circle -->
        </select>
        <div class="node-mode-wrap">
          <label class="check-pill">
            <input id="node-mode-all" type="checkbox" checked onchange="onNodeModeChange('all')" />
            <span>All</span>
          </label>
          <label class="check-pill">
            <input id="node-mode-attr" type="checkbox" onchange="onNodeModeChange('attr')" />
            <span>attr</span>
          </label>
        </div>
        <button onclick="insertNodeByShape()" class="btn">Add node</button>



      </div>

      <div class="toolbar-row">
        <!-- add edge value  -->
        <select id="edge-type" class="select-like-btn">
          <option value="" selected>&#xD654;&#xC0B4;&#xD45C; &#xC120;&#xD0DD;: --&gt;</option> <!-- Arrow select -->
          <option value="solid">&#xAE30;&#xBCF8; &#xC2E4;&#xC120; --&gt;</option> <!-- Solid -->
          <option value="thick">&#xB450;&#xAEBC;&#xC6B4; &#xC120; ==&gt;</option> <!-- Thick -->
          <option value="dashed">&#xC810;&#xC120; -.-&gt;</option> <!-- Dashed -->
          <option value="reverse">&#xC5ED;&#xBC29;&#xD5A5; &lt;--</option> <!-- Reverse -->
          <option value="both">&#xC591;&#xCABD; &#xC2E4;&#xC120; A &lt;--&gt; B</option> <!-- Bidirectional solid -->
          <option value="circle-end">&#xC6D0;&#xD615; &#xB9C8;&#xAC10; --o</option> <!-- Circle end -->
          <option value="circle-both">&#xC591;&#xCABD; &#xC6D0;&#xD615; A o--o B</option> <!-- Circle both ends -->
          <option value="x-end">X&#xC790; &#xB9C8;&#xAC10; --x</option> <!-- X end -->
          <option value="x-both">&#xC591;&#xCABD; X &#xD45C;&#xC2DC; A x--x B</option> <!-- X both ends -->
          <option value="normal-link">&#xC77C;&#xBC18; &#xC2E4;&#xC120; A --- B</option> <!-- Normal link -->
          <option value="thick-link">&#xB450;&#xAEBC;&#xC6B4; &#xC2E4;&#xC120; A === B</option> <!-- Thick link -->
          <option value="dashed-link">&#xC810;&#xC120; A -.- B</option> <!-- Dashed link -->
          <option value="invisible-link">&#xBCF4;&#xC774;&#xC9C0; &#xC54A;&#xB294; &#xC120; A ~~~ B</option> <!-- Invisible link -->
          <option value="solid-text-static">&#xC2E4;&#xC120; + &#xD14D;&#xC2A4;&#xD2B8; A --&gt;|&#xC870;&#xAC74;| B</option> <!-- Solid with text -->
          <option value="thick-text-static">&#xB450;&#xAEBC;&#xC6B4; &#xC120; + &#xD14D;&#xC2A4;&#xD2B8; A == &#xC911;&#xC694;&#xACBD;&#xB85C; ==&gt; B</option> <!-- Thick with text -->
          <option value="dashed-text-static">&#xC810;&#xC120; + &#xD14D;&#xC2A4;&#xD2B8; A -. &#xBCF4;&#xC870;&#xC124;&#xBA85; .-&gt; B</option> <!-- Dashed with text -->
          <option value="no-arrow-text">&#xD654;&#xC0B4;&#xD45C; &#xC5C6;&#xB294; &#xD14D;&#xC2A4;&#xD2B8; A -- &#xD14D;&#xC2A4;&#xD2B8; --- B</option> <!-- No arrow with text -->
          <option value="one-to-many">&#xB2E4;&#xC911; &#xCD9C;&#xB825; A --&gt; B &amp; C &amp; D</option> <!-- One to many -->
          <option value="many-to-one">&#xB2E4;&#xC911; &#xC785;&#xB825; B &amp; C &amp; D --&gt; E</option> <!-- Many to one -->
          <option value="chaining">&#xC5F0;&#xC18D; &#xC5F0;&#xACB0; A --&gt; B --&gt; C --&gt; D</option> <!-- Chaining -->
          <option value="complex-chaining">&#xBCF5;&#xD569; &#xCCB4;&#xC774;&#xB2DD; A --&gt; B &amp; C --&gt; D</option> <!-- Complex chaining -->


        </select>
        <div class="node-mode-wrap">
          <label class="check-pill">
            <input id="edge-mode-arrow" type="checkbox" checked onchange="onEdgeModeChange('arrow')" />
            <span>&#xD654;&#xC0B4;&#xD45C;&#xB9CC;</span>
          </label>
          <label class="check-pill">
            <input id="edge-mode-arrow-label" type="checkbox" onchange="onEdgeModeChange('arrow-label')" />
            <span>&#xD654;&#xC0B4;&#xD45C;+&#xC774;&#xB984;</span>
          </label>
          <label class="check-pill">
            <input id="edge-mode-label-only" type="checkbox" onchange="onEdgeModeChange('label-only')" />
            <span>&#xC774;&#xB984;&#xB9CC;</span>
          </label>
        </div>
        <input id="edge-label" class="input-like" type="text" placeholder="&#xC5F0;&#xACB0; &#xC774;&#xB984; (&#xC120;&#xD0DD;)" />
        <button onclick="insertEdgeByType()" class="btn">&#xC5F0;&#xACB0; &#xCD94;&#xAC00;</button> <!-- Add connection -->



        <select id="example-select" class="select-like-btn" onchange="loadTemplate(this.value)">
        <option value="">&#xC0D8;&#xD50C;&#xC120;&#xD0DD;</option> <!-- Select sample -->
        <option value="shopping" selected>Flow &#xAE30;&#xBCF8;</option> <!-- Flow basic -->
        <option value="sankey-basic">Sankey &#xAE30;&#xBCF8;</option> <!-- Sankey basic -->
        <option value="sankey-family">Sankey &#xD55C;&#xAE00;</option> <!-- Sankey (Korean labels) -->
        <option value="sankey-config">Sankey (showValues off)</option>
        <option value="state">State</option>
        <option value="class">Class</option>
        <option value="sequence">Sequence</option>
        <option value="er">ER</option>
        <option value="journey">Journey</option>
        <option value="mindmap">Mindmap</option>
        <option value="pie">Pie</option>
        <option value="timeline">Timeline</option>
        <option value="quadrant">Quadrant</option>
        <option value="xychart">XY Chart</option>
        <option value="block">Block</option>
        <option value="kanban-advanced">Kanban (advanced)</option>
        <option value="treemap">Treemap</option>
        <option value="requirement">Requirement</option>
        <option value="gantt">Gantt</option>
        <option value="architecture-basic">Architecture (basic)</option>
        <option value="block-stack">Block (stack)</option>
        <option value="block-columns">Block (columns)</option>
        <option value="radar-grades">Radar (grades)</option>
        <option value="radar-restaurant">Radar (restaurant)</option>
        <option value="venn-team">Venn (team overlap)</option>
        <option value="venn-ab">Venn (A/B values)</option>
        <option value="venn-nested">Venn (nested text)</option>
        <option value="venn-styled">Venn (styled)</option>
        <option value="ishikawa-photo">Ishikawa</option>
        <option value="treeview-basic">TreeView (basic)</option>
        <option value="treeview-config">TreeView (config)</option>
        <option value="gitgraph-basic">GitGraph</option>
        <option value="sequence-loop">Sequence (loop/alt/opt)</option>
        <option value="flowchart-lr">Flowchart (LR)</option>
        </select>
        <button onclick="openSyntaxTutorial()" class="btn">Syntax Tutorial</button>
        <button id="auto-fix-mermaid-btn" onclick="autoFixMermaidCode()" class="btn"
          title="괄호 등 특수문자가 들어간 노드와 연결 라벨을 안전한 문자열로 바꿉니다.">오류 자동수정</button>
        <button onclick="copyCode()" class="btn">&#xBCF5;&#xC0AC;</button>
                <button onclick="downloadSVG()" class="btn">SVG</button>
           <button onclick="downloadPNG()" class="btn">PNG</button>
        <button type="button" onclick="openSvgToPngConverterWindow()" class="btn" title="SVG→PNG 변환기를 독립 창으로 엽니다">SVG→PNG 변환기</button>
      </div>

      <!-- <div class="toolbar-row"> -->
      <!-- </div> -->
    </div>
  </header>

  <section id="image-to-mermaid" aria-label="이미지에서 Mermaid 코드 생성">
    <details id="mermaid-ai-model-settings">
      <summary id="mermaid-ai-provider-toggle-btn" aria-expanded="false">AI 모델</summary>
      <div id="mermaid-ai-provider-picker"></div>
    </details>
    <button id="mermaid-ai-collapse-btn" type="button" onclick="toggleMermaidAiPanel()" aria-expanded="true" aria-controls="mermaid-reference-inputs mermaid-prompt-input mermaid-ai-actions mermaid-text-input mermaid-code-revision">Jena ME 접기</button>
    <nav id="mermaid-input-tabs" role="tablist" aria-label="Jena ME 입력 방식">
      <button id="mermaid-image-tab" type="button" role="tab" aria-selected="true" aria-controls="mermaid-image-panel" data-ref-panel="mermaid-image-panel">이미지</button>
      <button id="mermaid-text-tab" type="button" role="tab" aria-selected="false" aria-controls="mermaid-text-input" data-ref-panel="mermaid-text-input" tabindex="-1">참고 텍스트</button>
      <button id="mermaid-code-tab" type="button" role="tab" aria-selected="false" aria-controls="mermaid-code-revision" data-ref-panel="mermaid-code-revision" tabindex="-1">가져온 코드 수정</button>
      <button id="mermaid-history-open" type="button" role="tab" aria-selected="false" aria-controls="mermaid-history-panel" data-ref-panel="mermaid-history-panel" tabindex="-1">저장 기록</button>
    </nav>
    <section id="mermaid-image-panel" role="tabpanel" aria-labelledby="mermaid-image-tab">
    <div id="mermaid-reference-inputs" class="mermaid-reference-card">
    <div id="mermaid-image-dropzone" tabindex="0" role="button" aria-label="분석할 이미지 선택 또는 붙여넣기">
      <input id="mermaid-image-file" type="file" accept="image/*" hidden />
      <div id="mermaid-image-empty" title="이미지 드래그 또는 Ctrl+V · PNG/JPG/WEBP"><span class="ref-upload-icon" aria-hidden="true">↥</span><b>이미지 업로드</b><span>PNG · JPG · WEBP · Ctrl+V</span></div>
      <img id="mermaid-image-preview" alt="분석할 이미지 미리보기" hidden />
    </div>
    <div class="mermaid-reference-actions">
      <button id="mermaid-image-select" type="button">이미지 선택</button>
      <button id="mermaid-image-paste" type="button" title="클립보드 이미지 붙여넣기" aria-label="클립보드 이미지 붙여넣기">붙여넣기</button>
      <button id="mermaid-image-large" type="button" disabled>크게 보기</button>
      <button id="mermaid-image-remove" type="button" hidden aria-label="선택 이미지 제거">제거</button>
    </div>
    </div>

    </section>
    <details id="mermaid-text-input" class="mermaid-text-reference" role="tabpanel" aria-labelledby="mermaid-text-tab" hidden>
      <summary>참고 텍스트</summary>
      <div class="mermaid-text-reference-body">
      <div class="mermaid-text-actions">
        <button id="mermaid-text-paste" type="button">텍스트 붙여넣기</button>
        <button id="mermaid-text-import" type="button">파일 가져오기</button>
        <button id="mermaid-text-selection" type="button">문서 선택 가져오기</button>
        <button id="mermaid-text-clear" type="button">비우기</button>
        <input id="mermaid-text-file" type="file" accept=".txt,.md,.markdown,.csv,.tsv,.json,.mmd,text/*" hidden />
      </div>
      <textarea id="mermaid-reference-text" aria-label="참고 텍스트" rows="3" placeholder="설명, 관계, 절차 등의 텍스트를 입력하거나 붙여넣으세요. 예: 부모코칭역량은 양육효능감에 영향을 주고, 양육효능감은 자녀사회성에 영향을 준다."></textarea>
      </div>
    </details>
    <details id="mermaid-code-revision" class="mermaid-text-reference" role="tabpanel" aria-labelledby="mermaid-code-tab" hidden>
      <summary>가져온 코드 수정 <small>참고 텍스트와 별도로 코드 + 수정 지시만 사용</small></summary>
      <div class="mermaid-text-reference-body revision-workspace">
        <div class="revision-toolbar">
        <div class="mermaid-text-actions">
          <button id="mermaid-code-import-current" type="button">현재 코드 가져오기</button>
        </div>
        <div class="revision-view-tabs" role="tablist" aria-label="수정 코드 보기">
          <button id="mermaid-revision-code-tab" type="button" role="tab" aria-selected="true" aria-controls="mermaid-revision-code-panel">코드</button>
          <button id="mermaid-revision-preview-tab" type="button" role="tab" aria-selected="false" aria-controls="mermaid-revision-preview-panel" tabindex="-1">미리보기</button>
        </div>
        </div>
        <div class="revision-code-pane">
        <div id="mermaid-revision-code-panel" role="tabpanel" aria-labelledby="mermaid-revision-code-tab">
        <label for="mermaid-code-revision-source">수정할 Mermaid 코드</label>
        <textarea id="mermaid-code-revision-source" rows="3" spellcheck="false" placeholder="현재 코드 가져오기를 누르거나 수정할 Mermaid 코드를 붙여넣으세요."></textarea>
        </div>
        <div id="mermaid-revision-preview-panel" role="tabpanel" aria-labelledby="mermaid-revision-preview-tab" tabindex="0" hidden>
          <div class="revision-preview-toolbar" aria-label="미리보기 도구">
            <button id="mermaid-revision-theme" type="button">Dark</button>
            <button id="mermaid-revision-zoom-out" type="button" aria-label="미리보기 축소">−</button>
            <output id="mermaid-revision-zoom">100%</output>
            <button id="mermaid-revision-zoom-in" type="button" aria-label="미리보기 확대">+</button>
            <button id="mermaid-revision-zoom-reset" type="button">Reset</button>
            <button id="mermaid-revision-download" type="button" title="현재 미리보기를 PNG로 다운로드" disabled>DN</button>
          </div>
          <div id="mermaid-revision-preview" aria-live="polite"></div>
          <div id="mermaid-revision-preview-error" role="status"></div>
        </div>
        </div>
        <div class="revision-chat-pane">
        <div id="mermaid-code-revision-result" role="log" aria-label="코드 수정 대화" aria-live="polite"><p class="revision-chat-hint">수정 요청과 답변이 여기에 표시됩니다. 검증된 코드는 왼쪽 코드창과 아래 편집기에 반영됩니다.</p></div>
        <label for="mermaid-code-revision-prompt">코드 수정 프롬프트</label>
        <textarea id="mermaid-code-revision-prompt" rows="2" placeholder="예: 노드와 문구는 유지하고 좌우 배치로 변경해 주세요."></textarea>
        <div class="mermaid-text-actions">
          <button id="mermaid-code-revision-run" type="button" disabled>JENA ME 실행</button>
          <button id="mermaid-code-revision-stop" type="button" disabled>수정 중지</button>
          <button id="mermaid-code-revision-apply" type="button" disabled>수정 결과 적용</button>
        </div>
        </div>
        <div id="mermaid-code-revision-status" role="status"></div>
      </div>
    </details>
    <aside id="mermaid-history-panel" role="tabpanel" aria-labelledby="mermaid-history-open" hidden>
      <div class="history-head"><strong>inDB Mermaid 생성 기록</strong><button type="button" onclick="toggleMermaidHistory(false)" aria-label="닫기">닫기</button></div>
      <input id="mermaid-history-search" type="search" placeholder="코드, 프롬프트, 이미지 이름 검색" />
      <div id="mermaid-history-list"><p class="history-empty">저장 기록을 불러오는 중입니다.</p></div>
    </aside>
    <div id="mermaid-ai-actions" class="mermaid-ai-actions">
    <details id="mermaid-prompt-input" class="ai-prompt-field"><summary>프롬프트</summary>
      <textarea id="mermaid-image-prompt" rows="2">참고 자료의 다이어그램 유형을 먼저 판단하고, 그 유형에 맞는 Mermaid 문법으로 재현해 주세요. 원본의 텍스트, 관계, 방향과 그룹을 보존해 주세요.</textarea>
    </details>
    <button id="mermaid-image-generate" type="button" class="btn ref-generate" disabled>
      <span class="run-icon" aria-hidden="true">▶</span> Jena ME 실행
    </button>

    <div class="mermaid-run-feedback">
    <div id="mermaid-image-status" aria-live="polite" hidden></div>
    <output id="mermaid-image-metrics" hidden></output>
    <div id="mermaid-image-progress-panel" hidden>
      <progress id="mermaid-image-progress" max="100" value="0" aria-label="AI 생성 단계 진행률"></progress>
      <span id="mermaid-image-progress-label" title="API는 전체 처리율을 제공하지 않습니다. 요청·수신·완료 단계 기준입니다.">단계 진행률 0%</span>
      <button id="mermaid-image-stop" type="button" class="btn">중지</button>
    </div>
    </div>
    </div>

  </section>
  <dialog id="mermaid-reference-dialog" aria-label="참조 이미지 크게 보기">
    <div class="ref-dialog-toolbar"><strong>참조 이미지</strong><div>
      <button type="button" data-ref-zoom="-">−</button><span id="mermaid-reference-zoom">맞춤</span><button type="button" data-ref-zoom="+">+</button>
      <button type="button" data-ref-zoom="fit">화면 맞춤</button><button type="button" data-ref-zoom="100">100%</button>
      <button type="button" id="mermaid-reference-close">닫기</button>
    </div></div>
    <div class="ref-dialog-viewport"><img id="mermaid-reference-full" alt="업로드한 참조 이미지" /></div>
  </dialog>

  <nav id="mobile-pane-switch" aria-label="Mermaid 작업 화면">
    <button type="button" data-pane="editor" aria-pressed="true" aria-controls="editor-pane">코드 편집</button>
    <button type="button" data-pane="preview" aria-pressed="false" aria-controls="preview-pane">미리보기</button>
    <button type="button" data-pane="both" aria-pressed="false" aria-controls="editor-pane preview-pane">함께 보기</button>
  </nav>
  <main id="main">
    <section id="editor-pane">
      <div class="pane-title pane-title-row">
        <span>&#xCF54;&#xB4DC; &#xD3B8;&#xC9D1;&#xAE30;</span>
        <div class="pane-title-actions">
          <button type="button" class="btn-light document-selection-import" id="document-selection-import-btn" onclick="requestSelectedDocumentText()">선택한 텍스트 가져오기</button>
          <div class="zoom-controls">
            <button type="button" class="btn-light" id="editor-theme-toggle-btn" onclick="toggleEditorTheme()">Dark</button>
            <button type="button" class="btn-light" onclick="adjustEditorScale(-0.1)">-</button>
            <span id="editor-scale-label">100%</span>
            <button type="button" class="btn-light" onclick="adjustEditorScale(0.1)">+</button>
            <button type="button" class="btn-light" onclick="resetEditorScale()">Reset</button>
          </div>
        </div>
      </div>
      <!-- code editor  -->
      <textarea id="raw-code-editor" spellcheck="false"></textarea>
      <!-- <div class="editor-help">
        <div>&#xB2E8;&#xCD95;&#xD0A4;</div>
        <div>Ctrl + Alt + ↓ : &#xD604;&#xC7AC; &#xC904; &#xC544;&#xB798;&#xB85C; &#xBCF5;&#xC0AC;</div>
        <div>Alt + ↑ / ↓ : &#xD604;&#xC7AC; &#xC904; &#xC774;&#xB3D9;</div>
      </div> -->
    </section>

    <div id="pane-divider" title="&#xC88C;&#xC6B0; &#xD328;&#xB110; &#xD06C;&#xAE30; &#xC870;&#xC808;"></div>

    <!-- Preview Zoom in out  -->
    <section id="preview-pane">
      <div class="pane-title pane-title-row">
        <span>&#xBBF8;&#xB9AC;&#xBCF4;&#xAE30;</span>
        <div class="zoom-controls">

          <button type="button" class="btn-light" id="preview-large-btn" onclick="openLargePreview()">크게 보기</button>
          <button type="button" class="btn-light" id="preview-theme-toggle-btn" onclick="togglePreviewTheme()">Dark</button>
          <button type="button" class="btn-light" onclick="adjustPreviewScale(-0.1)">-</button>
          <span id="preview-scale-label">100%</span>
          <button type="button" class="btn-light" onclick="adjustPreviewScale(0.1)">+</button>
          <button type="button" class="btn-light" onclick="resetPreviewScale()">Reset</button>
        </div>
      </div>
      <div id="render-wrapper">
        <div id="render"></div>
      </div>
      <div id="error" aria-live="polite"></div>
    </section>
  </main>
