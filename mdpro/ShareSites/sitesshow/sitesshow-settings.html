<div class="flex items-center justify-between gap-2">
    <label class="flex items-center gap-2 cursor-pointer select-none">
        <input type="checkbox" id="sites-visible" onclick="setTimeout(toggleSitesSection,0)"
            class="rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500">
        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Sites 보이기</span>
    </label>
    <button type="button" id="sites-settings-fold-btn" onclick="toggleSitesSettingsFold()"
        class="px-2 py-1 rounded border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700"
        title="Sites 설정 접기/펼치기" aria-controls="sites-settings-body" aria-expanded="true">접기</button>
</div>
<div id="sites-settings-body" class="mt-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-900/30 overflow-hidden">
    <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200">
        Sites 목록
    </div>
    <div class="p-3 border-b border-slate-200 dark:border-slate-700 space-y-2">
        <input type="text" id="sites-preferences-name-input" placeholder="사이트 이름 (선택)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addSiteFromPreferencesInput();}"
            class="w-full px-2.5 py-1.5 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs">
        <div class="flex items-center gap-2">
            <input type="url" id="sites-preferences-url-input" placeholder="주소 (https://example.com)"
                onkeydown="if(event.key==='Enter'){event.preventDefault();addSiteFromPreferencesInput();}"
                class="min-w-0 flex-1 px-2.5 py-1.5 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs">
            <button type="button" id="sites-preferences-submit-btn" onclick="addSiteFromPreferencesInput()"
                class="shrink-0 px-2.5 py-1.5 rounded bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700">추가</button>
            <button type="button" id="sites-preferences-cancel-btn" onclick="cancelPreferencesSiteEdit()"
                class="hidden shrink-0 px-2.5 py-1.5 rounded border border-slate-300 dark:border-slate-600 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>
        </div>
    </div>
    <div id="sites-preferences-list"
        class="max-h-64 overflow-auto divide-y divide-slate-200 dark:divide-slate-700"></div>
</div>
