<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 원본 보기</title><style>html,body{margin:0;min-height:100%;background:#0f172a;color:#eee;font:13px system-ui}header{padding:10px}img{display:block;max-width:100%;height:auto;margin:auto}button{padding:8px;cursor:pointer}</style></head><body><header><button id="actual">원본 크기 / 화면 맞춤</button></header><img id="image" alt="슬롯 배경 이미지"><script type="module">const image=document.getElementById('image');let fit=true;window.addEventListener('message',event=>{if(event.source===window.opener&&event.origin===location.origin&&event.data?.type==='tts-image-preview'&&/^data:image\//.test(event.data.image))image.src=event.data.image;});document.getElementById('actual').onclick=()=>{fit=!fit;image.style.maxWidth=fit?'100%':'none';};window.opener?.postMessage({type:'tts-image-preview-ready'},location.origin);</script></body></html>
