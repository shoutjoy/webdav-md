<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>WebDAV 백업 다운로드</title>
<style>:root{font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;color-scheme:dark;background:#0f172a;color:#e5e7eb}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#1e293b,#0f172a 60%)}main{width:min(430px,100%);padding:28px;border:1px solid #334155;border-radius:18px;background:#111827;box-shadow:0 24px 70px #020617aa}h1{font-size:23px;margin:0 0 8px}p{color:#94a3b8;font-size:13px;line-height:1.6}.file{margin:20px 0;padding:14px;border-radius:10px;background:#172033;color:#cbd5e1}.file strong{display:block;color:#f8fafc;margin-bottom:5px;overflow-wrap:anywhere}label{display:block;font-size:13px;margin-top:13px}input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:white;outline:none}input:focus{border-color:#818cf8;box-shadow:0 0 0 3px #4f46e533}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.status{min-height:20px;color:#fca5a5;margin-top:12px}</style></head>
<body><main><h1>백업 파일 다운로드</h1><p>이 링크에 지정된 WebDAV 백업 파일만 다운로드합니다.</p><div class="file" id="file">파일 정보를 확인하는 중입니다…</div><form id="form"><label>다운로드 ID<input id="username" autocomplete="username" required/></label><label>다운로드 비밀번호<input id="password" type="password" autocomplete="current-password" required/></label><button id="submit">인증 후 ZIP 다운로드</button><p class="status" id="status" role="alert"></p></form></main>
<script>
const params=new URLSearchParams(location.search),id=params.get('id'),base=new URL('./api/webdav-backups/public/',document.baseURI),file=document.getElementById('file'),status=document.getElementById('status');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=v=>v<1048576?(v/1024).toFixed(1)+' KB':(v/1048576).toFixed(1)+' MB';
async function info(){if(!id){file.textContent='잘못된 백업 링크입니다.';return}try{const r=await fetch(new URL(encodeURIComponent(id),base));const x=await r.json();if(!r.ok)throw Error(x.error);file.innerHTML=`<strong>${esc(x.fileName)}</strong>${new Date(x.completedAt).toLocaleString('ko-KR')} · ${x.fileCount}개 파일 · ${bytes(x.size)}`;}catch(e){file.textContent=e.message}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;status.textContent='인증하고 다운로드를 준비하는 중입니다…';try{const auth=btoa(unescape(encodeURIComponent(document.getElementById('username').value+':'+document.getElementById('password').value)));const r=await fetch(new URL(encodeURIComponent(id)+'/download',base),{headers:{Authorization:'Basic '+auth}});if(!r.ok){const x=await r.json();throw Error(x.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(r.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1]||'webdav-backup.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.style.color='#6ee7b7';status.textContent='다운로드를 시작했습니다.';}catch(err){status.style.color='#fca5a5';status.textContent=err.message||'다운로드에 실패했습니다.'}finally{button.disabled=false}});info();
</script></body></html>
